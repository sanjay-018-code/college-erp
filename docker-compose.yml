version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      # CHANGE_ME: set POSTGRES_PASSWORD in your .env file, do not leave default in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - erp_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - erp_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # CHANGE_ME: map to 80/443 directly if this is the only app on the server,
      # or keep 8080 and put the college's existing reverse proxy in front of it
      - "8080:80"
    volumes:
      - static_data:/usr/share/nginx/static:ro
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  erp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
